name: CI/CD and Deploy Pipeline

on:
  push:
    branches:
      - auto-mlops

jobs:
  ci-cd:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Install Python and DVC
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
      - run: |
          python -m pip install --upgrade pip
          pip install dvc

      - name: Authenticate DVC with DagsHub
        env:
          DVC_DAGSHUB_USER: ${{ secrets.DAGSHUB_USERNAME }}
          DVC_DAGSHUB_PASS: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          dvc remote modify origin --local user $DVC_DAGSHUB_USER
          dvc remote modify origin --local password $DVC_DAGSHUB_PASS
      - name: Pull data from DagsHub
        run: |
          dvc pull

      - name: Run DVC Pipeline
        run: dvc repro

      - name: Commit and Push Changes
        env:
          GITHUB_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          git config --global user.name 'Wajih Hlaili'
          git config --global user.email 'wajihhlaili888@gmail.com'
          git add .
          git commit -m 'Update model' || echo "No changes to commit"
          git push origin auto-mlops

  deploy:
    runs-on: ubuntu-latest
    needs: ci-cd
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        with:
          project_id: automlops-445203
          install_components: 'beta'

      - name: Build and Push Docker Image for Frontend
        run: |
          docker build -t gcr.io/automlops-445203/frontend -f Dockerfile-flask .
          docker push gcr.io/automlops-445203/frontend

      - name: Build and Push Docker Image for Backend
        run: |
          docker build -t gcr.io/automlops-445203/backend -f Dockerfile-fastapi .
          docker push gcr.io/automlops-445203/backend

      - name: Deploy Frontend to Cloud Run
        run: |
          gcloud run deploy frontend \
            --image gcr.io/automlops-445203/frontend \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated

      - name: Deploy Backend to Cloud Run
        run: |
          gcloud run deploy backend \
            --image gcr.io/automlops-445203/backend \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated
